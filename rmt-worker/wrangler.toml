name = "rmt-fullsite"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Non-secret config (safe to commit)
[vars]
SUPABASE_URL = "https://your-project.supabase.co"

# Secrets — set these with `wrangler secret put NAME`, never commit them:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_JWT_SECRET   (Settings -> API -> JWT Secret)
#   wrangler secret put CF_ACCOUNT_ID
#   wrangler secret put CF_API_TOKEN          (Pages:Edit permission)
#   wrangler secret put CF_PAGES_PROJECT       (your Pages project name, "direct upload" type)

# If serving the Pages frontend from the same zone, add a route, e.g.:
# routes = [{ pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }]
